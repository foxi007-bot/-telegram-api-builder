
name: Build Telegram Local Bot API for Debian 12

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:12

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git cmake g++ gperf make zlib1g-dev libssl-dev binutils

      - name: Show build environment
        run: |
          cat /etc/os-release
          ldd --version

      - name: Download Telegram source
        run: |
          git clone --recursive https://github.com/tdlib/telegram-bot-api.git

      - name: Compile Telegram API
        run: |
          cd telegram-bot-api
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=.. ..
          cmake --build . --target install --parallel 2

      - name: Verify executable
        run: |
          ldd telegram-bot-api/bin/telegram-bot-api
          objdump -T telegram-bot-api/bin/telegram-bot-api | grep GLIBC_ | sort -V | tail -5

      - name: Package executable
        run: |
          tar -czf telegram-api-debian12.tar.gz -C telegram-bot-api/bin telegram-bot-api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-api-debian12
          path: telegram-api-debian12.tar.gz
          retention-days: 7
